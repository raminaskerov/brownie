[project]
name = "brownie-browser"
version = "0.1.0"
description = "A small, occasional browser runner"
requires-python = ">=3.12"
dependencies = ["playwright>=1.50,<2"]

[project.scripts]
brownie = "brownie_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.browser-profile/", "/.browser-profile-cdp/", "/.env", "/dist/"]

[tool.hatch.build.targets.wheel]
packages = ["src/brownie_agent"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
